<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" role="img" aria-label="timeld">
  <!--
  The mark: the wordmark's slanted cut on a disc. Time's indigo holds the top left,
       meld's amber the bottom right, and a little noise lets the inks run into each
       other along the slant, the way they do through the "me" of the wordmark.
  -->
  <style>
    .t { fill: #2C45A8 } .m { fill: #A5680A }
    @media (prefers-color-scheme: dark) { .t { fill: #A9B7F4 } .m { fill: #EEBF60 } }
  </style>
  <defs>
    <filter id="f" filterUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.045" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.6"/>
    </filter>
    <mask id="k" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
      <polygon points="-60,-60 160,-60 -60,160" fill="#fff" filter="url(#f)"/>
    </mask>
  </defs>
  <circle class="m" cx="50" cy="50" r="46"/>
  <circle class="t" cx="50" cy="50" r="46" mask="url(#k)"/>
</svg>
